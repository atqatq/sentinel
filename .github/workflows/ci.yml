name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard:
    name: Policy guards (forbidden terms & secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Forbidden terms & secret scan
        run: bash scripts/guards/forbidden-terms.sh
      - name: SDS token parity (design handoff vs theme)
        run: node scripts/guards/sds-token-parity.mjs
      - name: UI primitives scope (packages/ui only)
        run: bash scripts/guards/ui-primitives-scope.sh
      - name: Golden fixture checksums (H12)
        run: bash scripts/check-fixtures.sh

  golden-tests:
    name: Golden tests (117)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Engine golden suite (86)
        run: node packages/core/modules/planning-engine/test/engine.test.js
      - name: M5 supply-status producers — named proof ingestion/supply-status-producers (22)
        run: node packages/core/modules/planning-engine/test/supply.test.js
      - name: Feedback suite (31)
        run: node packages/core/modules/execution-feedback/test/feedback.test.js
      - name: M6 receipt→PO-line matching — named proof feedback/matching (27)
        run: node packages/core/modules/execution-feedback/test/matching.test.js
      - name: M4 the loop's second turn — scorecards fed by matching, named proof feedback/scorecard-matching-fed (16)
        run: node packages/core/modules/execution-feedback/test/scorecards.test.js
      - name: M3 the loop's learning turn — efficacy fed by matching, named proof feedback/efficacy-matching-fed (18)
        run: node packages/core/modules/execution-feedback/test/efficacy.test.js
      - name: KPI catalog — dataState envelope, A1/A2 named proofs (24)
        run: node packages/core/modules/kpi-catalog/test/catalog.test.js
      - name: H4 canonical date boundary — tenant-TZ explicit, day-unit math (25)
        run: node packages/core/modules/calendar/test/dates.test.js
      - name: H9 working calendar — flat-tenant-identical + Ramadan adjustment (29)
        run: node packages/core/modules/calendar/test/calendar.test.js
      - name: Plan service — engine live wiring + sealed snapshots + M8 restatement (57)
        run: node packages/plan-service/test/plan.test.js
      - name: Ops freshness alarm — DAT-01 SLO + missing-deliveries channel (19)
        run: node packages/core/modules/ops/test/freshness.test.js
      - name: C3 approval decision layer — SoD, tiers, dual control, freeze, M7 CF governance (55)
        run: node packages/core/modules/approval/test/approval.test.js
      - name: H5 ledger module — RFC 8785 JCS vectors, §16.2 gate, keyed chain verify (50)
        run: node packages/core/modules/ledger/test/ledger.test.js
      - name: M11 auth module — RFC 6238 TOTP, session floor, lockout, mfa-approvals gate (27)
        run: node packages/core/modules/auth/test/auth.test.js

  ingestion-tests:
    name: Ingestion boundary suites (strict parse + file binding)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Strict parse + bounds + quarantine + deliveries guard (32)
        run: node packages/core/modules/ingestion/test/parse.test.js
      - name: File-kind binding + allow-list + purge enforcement (16, checksum-pinned fixtures)
        run: node packages/core/modules/ingestion/test/filebinding.test.js
      - name: Unit resolution + C1 conversion + C2 money + §14.6c PO status (39)
        run: node packages/core/modules/ingestion/test/normalize.test.js
      - name: H8 window alignment guard — refuse to seed uncovered (26)
        run: node packages/core/modules/ingestion/test/window.test.js
      - name: H10 inbound hardening — magic bytes, zip caps, formula stripping, XXE, AV (46)
        run: node packages/core/modules/ingestion/test/hardening.test.js
      - name: H6 idempotent upsert wrapper — keys + replay plan (29)
        run: node packages/core/modules/ingestion/test/idempotency.test.js
      - name: File-to-rows worker — gate to executor, persistence, day-expansion (37)
        run: node packages/ingest-service/test/worker.test.js
      - name: Ingest worker adapter — ports + register lifecycle + task writers (26)
        run: node packages/db/test/ingest-worker-adapter.test.js
      - name: Procure adapter — C3 workflow executor via stub client (22)
        run: node packages/db/test/procure-adapter.test.js

  db-rls:
    name: DB schema + RLS deny matrix (postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Structural schema tests (no server)
        run: node packages/db/test/schema.test.js
      - name: Ingest adapter — plan execution via stub client (27)
        run: node packages/db/test/ingest-adapter.test.js
      - name: Ledger adapter — statement-first append via stub client (11)
        run: node packages/db/test/ledger-adapter.test.js
      - name: Auth adapter — sessions, TOTP wrap-at-rest, attemptLogin via stub client (28)
        run: node packages/db/test/auth-adapter.test.js
      - name: M8 restatement door — version chain + Class-W RESTATE_DAY block via stub client (13)
        run: node packages/db/test/restatement-adapter.test.js
      - name: Install pg client for the matrix
        run: npm install --prefix packages/db pg@8 --no-save --no-audit --no-fund
      - name: RLS deny matrix (live)
        run: node packages/db/test/rls-deny-matrix.js
        env:
          DATABASE_URL_ADMIN: postgres://postgres:postgres@127.0.0.1:5432/postgres
      - name: Plan-seal live — engine run, replay, M8 restatement chain, ledger verify, RLS (27)
        run: node packages/db/test/plan-seal-live.js
        env:
          DATABASE_URL_ADMIN: postgres://postgres:postgres@127.0.0.1:5432/postgres
      - name: Ingest-replay live — per-tenant replay no-op, H7 merge through the freeze, M7 CF staging, RLS (29)
        run: node packages/db/test/ingest-replay-live.js
        env:
          DATABASE_URL_ADMIN: postgres://postgres:postgres@127.0.0.1:5432/postgres
      - name: SOD live — SoD invariant, dual control, supplier freeze, CF governance, Origin-only (C3)
        run: node packages/db/test/sod-live.js
        env:
          DATABASE_URL_ADMIN: postgres://postgres:postgres@127.0.0.1:5432/postgres
      - name: LEDGER live — tamper-resistant, origin-cannot-mutate, chain guard, verifier role (H5)
        run: node packages/db/test/ledger-live.js
        env:
          DATABASE_URL_ADMIN: postgres://postgres:postgres@127.0.0.1:5432/postgres
      - name: AUTH live — session floor, lockout, TOTP wrap-at-rest, the mfa gate (M11)
        run: node packages/db/test/auth-live.js
        env:
          DATABASE_URL_ADMIN: postgres://postgres:postgres@127.0.0.1:5432/postgres
          SESSION_WRAP_KEY: ci-auth-live-wrap-key-0123456789abcdef-0123456789abcdef

  ui-checks:
    name: UI package (typecheck + theme compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm (corepack, per packageManager field)
        run: corepack enable pnpm 2>/dev/null || npm i -g pnpm@9.12.0
      - name: Install workspace deps
        run: pnpm install --frozen-lockfile
      - name: Typecheck vendored primitives
        run: pnpm -C packages/ui typecheck
      - name: Compile-verify SDS theme mapping
        run: pnpm -C packages/ui build:css
      - name: Status vocabulary binding — engine displayStatus/supplyStatus ↔ tones (53)
        run: npm run test:status

  web-shell:
    name: apps/web (Next.js build + typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm (corepack, per packageManager field)
        run: corepack enable pnpm 2>/dev/null || npm i -g pnpm@9.12.0
      - name: Install workspace deps
        run: pnpm install --frozen-lockfile
      - name: Build the shell (Next.js 15, SDS theme, plan route)
        run: pnpm -C apps/web build
      - name: Data-health facts composition — freshness envelope + register rules (15)
        run: node --experimental-strip-types apps/web/test/data-health-facts.test.ts
      - name: Status vocabulary guard
        run: bash scripts/guards/status-vocabulary-binding.sh
