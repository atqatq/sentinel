name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard:
    name: Policy guards (forbidden terms & secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Forbidden terms & secret scan
        run: bash scripts/guards/forbidden-terms.sh
      - name: SDS token parity (design handoff vs theme)
        run: node scripts/guards/sds-token-parity.mjs
      - name: UI primitives scope (packages/ui only)
        run: bash scripts/guards/ui-primitives-scope.sh
      - name: Golden fixture checksums (H12)
        run: bash scripts/check-fixtures.sh

  golden-tests:
    name: Golden tests (117)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Engine golden suite (86)
        run: node packages/core/modules/planning-engine/test/engine.test.js
      - name: Feedback suite (31)
        run: node packages/core/modules/execution-feedback/test/feedback.test.js
      - name: KPI catalog — dataState envelope, A1/A2 named proofs (24)
        run: node packages/core/modules/kpi-catalog/test/catalog.test.js
      - name: H4 canonical date boundary — tenant-TZ explicit, day-unit math (25)
        run: node packages/core/modules/calendar/test/dates.test.js
      - name: H9 working calendar — flat-tenant-identical + Ramadan adjustment (29)
        run: node packages/core/modules/calendar/test/calendar.test.js

  ingestion-tests:
    name: Ingestion boundary suites (strict parse + file binding)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Strict parse + bounds + quarantine + deliveries guard (32)
        run: node packages/core/modules/ingestion/test/parse.test.js
      - name: File-kind binding + allow-list + purge enforcement (16, checksum-pinned fixtures)
        run: node packages/core/modules/ingestion/test/filebinding.test.js
      - name: Unit resolution + C1 conversion + C2 money normalization (36)
        run: node packages/core/modules/ingestion/test/normalize.test.js
      - name: H8 window alignment guard — refuse to seed uncovered (26)
        run: node packages/core/modules/ingestion/test/window.test.js
      - name: H10 inbound hardening — magic bytes, zip caps, formula stripping, XXE, AV (46)
        run: node packages/core/modules/ingestion/test/hardening.test.js

  db-rls:
    name: DB schema + RLS deny matrix (postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Structural schema tests (no server)
        run: node packages/db/test/schema.test.js
      - name: Install pg client for the matrix
        run: npm install --prefix packages/db pg@8 --no-save --no-audit --no-fund
      - name: RLS deny matrix (live)
        run: node packages/db/test/rls-deny-matrix.js
        env:
          DATABASE_URL_ADMIN: postgres://postgres:postgres@127.0.0.1:5432/postgres

  ui-checks:
    name: UI package (typecheck + theme compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm (corepack, per packageManager field)
        run: corepack enable pnpm 2>/dev/null || npm i -g pnpm@9.12.0
      - name: Install workspace deps
        run: pnpm install --frozen-lockfile
      - name: Typecheck vendored primitives
        run: pnpm -C packages/ui typecheck
      - name: Compile-verify SDS theme mapping
        run: pnpm -C packages/ui build:css
