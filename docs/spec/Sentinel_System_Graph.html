<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sentinel — System Graph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#141414; --surface:#1e1e1e; --text:#ededed; --divider:#ffffff14;
    --n700:#c0c0c0; --n600:#a3a3a3; --n500:#8a8a8a; --n100:#242424;
    --green:#4cc38a; --red:#ff8080; --blue:#54a9ff; --orange:#ffa64d; --purple:#b48cff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:'Figtree',system-ui,sans-serif;text-rendering:geometricPrecision;}
  .wrap{padding:32px;display:flex;justify-content:center}
  svg{display:block;max-width:100%;height:auto}
  text{font-family:'Figtree',system-ui,sans-serif;fill:var(--text)}
  .h1{font-size:26px;font-weight:700;letter-spacing:-0.5px}
  .sub{font-size:13px;fill:var(--n500);font-weight:400}
  .eyebrow{font-size:11px;font-weight:600;letter-spacing:1.1px;fill:var(--n500)}
  .card-t{font-size:14px;font-weight:600;letter-spacing:-0.2px}
  .item{font-size:11.5px;fill:var(--n700);font-weight:400}
  .mono{font-family:'JetBrains Mono',monospace;font-size:11px;fill:var(--n600)}
  .monoB{font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:600}
  .card{fill:var(--surface);stroke:var(--divider);stroke-width:1;rx:10}
  .bar{fill:var(--n100);stroke:var(--divider);stroke-width:1;rx:10}
  .flow{stroke:var(--n500);stroke-width:1.25;fill:none;marker-end:url(#a)}
  .flowB{stroke:var(--blue);stroke-width:1.5;fill:none;marker-end:url(#ab)}
</style>
</head>
<body>
<div class="wrap">
<svg viewBox="0 0 1440 1216" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sentinel system architecture">
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#8a8a8a"/></marker>
    <marker id="ab" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#54a9ff"/></marker>
  </defs>

  <!-- ── TITLE ───────────────────────────────────────────── -->
  <text class="h1" x="32" y="42">Sentinel</text>
  <text class="sub" x="132" y="42">Supply-chain planning, sourcing &amp; intelligence platform · multi-tenant (MP) · Precoro-fed</text>
  <line x1="32" y1="60" x2="1408" y2="60" stroke="#ffffff14"/>

  <!-- ── ROW A · TENANCY + INGESTION ─────────────────────── -->
  <text class="eyebrow" x="32" y="92">TENANCY</text>
  <rect class="card" x="32" y="104" width="448" height="104"/>
  <text class="card-t" x="52" y="130">Mountain Peak (MP) tenants</text>
  <text class="item" x="52" y="152">Isolated data · own day-state · own KPIs · own rates</text>
  <rect x="52" y="164" width="104" height="26" rx="13" fill="#54a9ff1f"/>
  <text class="monoB" x="72" y="181" fill="#54a9ff">BahrainMP</text>
  <rect x="164" y="164" width="94" height="26" rx="13" fill="#54a9ff1f"/>
  <text class="monoB" x="184" y="181" fill="#54a9ff">QatarMP</text>
  <text class="mono" x="270" y="181">+ KMP · UMP · OMP · KSA later</text>

  <text class="eyebrow" x="496" y="92">INGESTION · FILE-BASED, PULL-ONLY, NO WRITE-BACK</text>
  <rect class="card" x="496" y="104" width="912" height="104"/>
  <text class="card-t" x="516" y="130">Precoro exports → automated pipeline</text>
  <g class="mono" font-size="10.5">
    <rect x="516" y="146" width="96" height="24" rx="6" fill="#242424" stroke="#ffffff14"/><text x="532" y="162">detect</text>
    <rect x="620" y="146" width="112" height="24" rx="6" fill="#242424" stroke="#ffffff14"/><text x="632" y="162">strip tips</text>
    <rect x="740" y="146" width="120" height="24" rx="6" fill="#242424" stroke="#ffffff14"/><text x="752" y="162">normalize</text>
    <rect x="868" y="146" width="104" height="24" rx="6" fill="#242424" stroke="#ffffff14"/><text x="884" y="162">validate</text>
    <rect x="980" y="146" width="104" height="24" rx="6" fill="#242424" stroke="#ffffff14"/><text x="996" y="162">upsert</text>
    <rect x="1092" y="146" width="112" height="24" rx="6" fill="#242424" stroke="#ffffff14"/><text x="1104" y="162">recompute</text>
    <rect x="1212" y="146" width="104" height="24" rx="6" fill="#242424" stroke="#ffffff14"/><text x="1226" y="162">snapshot</text>
    <rect x="1324" y="146" width="68" height="24" rx="6" fill="#242424" stroke="#ffffff14"/><text x="1338" y="162">tasks</text>
  </g>
  <text class="item" x="516" y="192">ITEMS · SUPPLIERS · INVENTORY (all-dimensions) · OPEN POs · CONSUMPTION  +  deliveries/day entered per tenant</text>

  <!-- ── ROW B · DATA SPINE ──────────────────────────────── -->
  <text class="eyebrow" x="32" y="248">DATA SPINE · PLANNING GRAIN = RECIPE REFERENCE</text>
  <rect class="card" x="32" y="260" width="332" height="112"/>
  <text class="card-t" x="52" y="286">CATEGORY</text>
  <text class="mono" x="52" y="308">24 categories · 19 in buyer matrix</text>
  <text class="item" x="52" y="328">Category Owner per tenant</text>
  <text class="item" x="52" y="348">Packaging-Imported = global owner</text>

  <rect class="card" x="380" y="260" width="332" height="112"/>
  <text class="card-t" x="400" y="286">RECIPE REFERENCE</text>
  <text class="mono" x="400" y="308">1,395 refs · 734 multi-SKU · max 50</text>
  <text class="item" x="400" y="328">▲ All planning math computes here</text>
  <text class="item" x="400" y="348">Status · levels · order proposal</text>

  <rect class="card" x="728" y="260" width="332" height="112"/>
  <text class="card-t" x="748" y="286">SKU</text>
  <text class="mono" x="748" y="308">3,993 items · 3,445 active</text>
  <text class="item" x="748" y="328">Stock reality · price · conv. factor</text>
  <text class="item" x="748" y="348">50 raw units → canonical catalog</text>

  <rect class="card" x="1076" y="260" width="332" height="112"/>
  <text class="card-t" x="1096" y="286">DIMENSIONS</text>
  <text class="item" x="1096" y="308">26 warehouses · own / 3PL / staging</text>
  <text class="item" x="1096" y="328">quarantine · consignment · virtual</text>
  <text class="item" x="1096" y="348">230 suppliers · 84% lead-time gap</text>

  <path class="flow" d="M364,316 L376,316"/>
  <path class="flow" d="M712,316 L724,316"/>
  <path class="flow" d="M1060,316 L1072,316"/>

  <!-- ── ROW C · THE FIVE NODES ──────────────────────────── -->
  <text class="eyebrow" x="32" y="412">THE FIVE NODES</text>

  <rect class="card" x="32" y="424" width="264" height="304"/>
  <rect x="32" y="424" width="264" height="3" rx="1.5" fill="#4cc38a"/>
  <text class="card-t" x="52" y="454">PLAN</text>
  <text class="mono" x="52" y="472" fill="#4cc38a">engine · verified</text>
  <g class="item">
    <text x="52" y="500">Run rate · consumption/day</text>
    <text x="52" y="522">Safety stock · reorder point</text>
    <text x="52" y="544">EOQ · MOQ · max · cycle</text>
    <text x="52" y="566">Days of cover · run-out</text>
    <text x="52" y="588">7-rung status ladder</text>
    <text x="52" y="610">Deliveries/day → primitive</text>
    <text x="52" y="632">Auto-optimisation (proposed)</text>
    <text x="52" y="654">Manual weights + overrides</text>
    <text x="52" y="676">DIO target vs actual</text>
    <text x="52" y="698">Forecast baseline</text>
  </g>

  <rect class="card" x="310" y="424" width="264" height="304"/>
  <rect x="310" y="424" width="264" height="3" rx="1.5" fill="#54a9ff"/>
  <text class="card-t" x="330" y="454">SOURCE</text>
  <text class="mono" x="330" y="472" fill="#54a9ff">replenish</text>
  <g class="item">
    <text x="330" y="500">Order proposals → approval</text>
    <text x="330" y="522">PR create · open · follow-up</text>
    <text x="330" y="544">PO create · open · close</text>
    <text x="330" y="566">Supplier lead times</text>
    <text x="330" y="588">Local vs imported routing</text>
    <text x="330" y="610">Import lead times · shipments</text>
    <text x="330" y="632">Landed cost allocation</text>
    <text x="330" y="654">Price by supplier · history</text>
    <text x="330" y="676">Savings (4 baselines)</text>
    <text x="330" y="698">Payment terms · DPO</text>
  </g>

  <rect class="card" x="588" y="424" width="264" height="304"/>
  <rect x="588" y="424" width="264" height="3" rx="1.5" fill="#ffa64d"/>
  <text class="card-t" x="608" y="454">INVENTORY</text>
  <text class="mono" x="608" y="472" fill="#ffa64d">store · stage</text>
  <g class="item">
    <text x="608" y="500">On-hand by warehouse</text>
    <text x="608" y="522">Company · 3PL · consignment</text>
    <text x="608" y="544">Staging areas · transfers</text>
    <text x="608" y="566">Quarantine · rejected</text>
    <text x="608" y="588">Available = on-hand − held</text>
    <text x="608" y="610">Valuation · unit value</text>
    <text x="608" y="632">Warehouse cost · cost/CBM</text>
    <text x="608" y="654">IRA · cycle count</text>
    <text x="608" y="676">DIO · total on hand</text>
    <text x="608" y="698">Movement ledger</text>
  </g>

  <rect class="card" x="866" y="424" width="264" height="304"/>
  <rect x="866" y="424" width="264" height="3" rx="1.5" fill="#b48cff"/>
  <text class="card-t" x="886" y="454">OPERATIONS</text>
  <text class="mono" x="886" y="472" fill="#b48cff">process · people</text>
  <g class="item">
    <text x="886" y="500">Tasks · deadlines · updates</text>
    <text x="886" y="522">Files · comments · custom fields</text>
    <text x="886" y="544">Auto-assign to category owner</text>
    <text x="886" y="566">Projects · meetings</text>
    <text x="886" y="588">SKU approvals: nutrition</text>
    <text x="886" y="610">SKU approvals: production</text>
    <text x="886" y="632">Price-change approval</text>
    <text x="886" y="654">Business continuity plans</text>
    <text x="886" y="676">Inactive / banned lifecycle</text>
    <text x="886" y="698">Slack workflow bridge</text>
  </g>

  <rect class="card" x="1144" y="424" width="264" height="304"/>
  <rect x="1144" y="424" width="264" height="3" rx="1.5" fill="#ff8080"/>
  <text class="card-t" x="1164" y="454">SRM</text>
  <text class="mono" x="1164" y="472" fill="#ff8080">supplier relations</text>
  <g class="item">
    <text x="1164" y="500">Supplier master · terms</text>
    <text x="1164" y="522">Lead-time observations</text>
    <text x="1164" y="544">OTIF · fill rate · scorecard</text>
    <text x="1164" y="566">Suppliers by category</text>
    <text x="1164" y="588">Suppliers by recipe ref</text>
    <text x="1164" y="610">Spend ranking · share</text>
    <text x="1164" y="632">Single-source risk</text>
    <text x="1164" y="654">Quotes → best-available</text>
    <text x="1164" y="676">Banned / inactive suppliers</text>
    <text x="1164" y="698">Payment terms (days)</text>
  </g>

  <!-- node interlinks -->
  <path class="flowB" d="M296,560 L306,560"/>
  <path class="flowB" d="M574,560 L584,560"/>
  <path class="flowB" d="M852,560 L862,560"/>
  <path class="flowB" d="M1130,560 L1140,560"/>

  <!-- ── ROW D · CROSS-CUTTING ───────────────────────────── -->
  <text class="eyebrow" x="32" y="768">CROSS-CUTTING PLANES</text>

  <rect class="card" x="32" y="780" width="332" height="168"/>
  <text class="card-t" x="52" y="806">ANALYTICS</text>
  <g class="item">
    <text x="52" y="832">Analysis: SKU · ref · category · price</text>
    <text x="52" y="854">Spend · savings · top consumption</text>
    <text x="52" y="876">Comparison: tenant × tenant</text>
    <text x="52" y="898">COGS monthly / quarterly / yearly</text>
    <text x="52" y="920">Targets: COGS · Capex · Opex · DIO</text>
  </g>

  <rect class="card" x="380" y="780" width="332" height="168"/>
  <text class="card-t" x="400" y="806">INTELLIGENCE</text>
  <text class="mono" x="518" y="806" fill="#b48cff">origin-only</text>
  <g class="item">
    <text x="400" y="832">Claude API (server-side key)</text>
    <text x="400" y="854">Opportunities · risks · optimisations</text>
    <text x="400" y="876">Versioned .md per MP + consolidated</text>
    <text x="400" y="898">Follow-ups → tasks (approval-gated)</text>
    <text x="400" y="920">ML later · baseline stats first</text>
  </g>

  <rect class="card" x="728" y="780" width="332" height="168"/>
  <text class="card-t" x="748" y="806">GOVERNANCE</text>
  <g class="item">
    <text x="748" y="832">O (Origin / root) = Superuser</text>
    <text x="748" y="854">SCM · SBR · BYR</text>
    <text x="748" y="876">DTA · VWR</text>
    <text x="748" y="898">Permission table: role × resource</text>
    <text x="748" y="920">CRUD + upload/download × tenant</text>
  </g>

  <rect class="card" x="1076" y="780" width="332" height="168"/>
  <text class="card-t" x="1096" y="806">CONSOLIDATED VIEW</text>
  <g class="item">
    <text x="1096" y="832">All-MP rollup · superuser+ only</text>
    <text x="1096" y="854">Currency: MP local ↔ USD reserve</text>
    <text x="1096" y="876">FX rate pinned 24h per tenant-day</text>
    <text x="1096" y="898">Tenant comparison &amp; benchmarking</text>
    <text x="1096" y="920">Gated at screen AND data layer</text>
  </g>

  <!-- ── ROW E · LEDGER FOUNDATION ───────────────────────── -->
  <text class="eyebrow" x="32" y="988">FOUNDATION · IMMUTABLE HISTORY</text>
  <rect class="bar" x="32" y="1000" width="1376" height="96"/>
  <text class="card-t" x="52" y="1028">HASH-CHAINED APPEND-ONLY LEDGER</text>
  <text class="item" x="330" y="1028">every action &amp; transaction · each record carries hash of previous · tamper-evident even to origin</text>
  <g class="mono" font-size="10.5">
    <rect x="52" y="1044" width="150" height="26" rx="6" fill="#1e1e1e" stroke="#ffffff14"/><text x="68" y="1061">daily state snapshot</text>
    <rect x="210" y="1044" width="134" height="26" rx="6" fill="#1e1e1e" stroke="#ffffff14"/><text x="226" y="1061">select any date</text>
    <rect x="352" y="1044" width="168" height="26" rx="6" fill="#1e1e1e" stroke="#ffffff14"/><text x="368" y="1061">compare date ↔ date</text>
    <rect x="528" y="1044" width="142" height="26" rx="6" fill="#1e1e1e" stroke="#ffffff14"/><text x="544" y="1061">Merkle anchoring</text>
    <rect x="678" y="1044" width="126" height="26" rx="6" fill="#1e1e1e" stroke="#ffffff14"/><text x="694" y="1061">WORM + offsite</text>
    <rect x="812" y="1044" width="150" height="26" rx="6" fill="#1e1e1e" stroke="#ffffff14"/><text x="828" y="1061">action + txn logs</text>
    <rect x="970" y="1044" width="126" height="26" rx="6" fill="#1e1e1e" stroke="#ffffff14"/><text x="986" y="1061">price history</text>
    <rect x="1104" y="1044" width="152" height="26" rx="6" fill="#1e1e1e" stroke="#ffffff14"/><text x="1120" y="1061">parameter history</text>
    <rect x="1264" y="1044" width="128" height="26" rx="6" fill="#1e1e1e" stroke="#ffffff14"/><text x="1280" y="1061">decades · 24/7</text>
  </g>

  <!-- ── FOOTER · ENGINE FORMULAS ────────────────────────── -->
  <line x1="32" y1="1128" x2="1408" y2="1128" stroke="#ffffff14"/>
  <text class="eyebrow" x="32" y="1156">ENGINE — VERIFIED BYTE-COMPATIBLE WITH RIYADH DDS (MATURE) · 117/117 TESTS</text>
  <g class="mono" font-size="10.5" fill="#a3a3a3">
    <text x="32" y="1180">J = magnified monthly / 22   ·   R = safetyDays × J   ·   S = (lead + safetyDays) × J   ·   T = max(MOQ, orderFreq × J)   ·   U = T + R   ·   V = R + T/2</text>
    <text x="32" y="1200">status: Over Stock → NC → Zero Stock → Below Safety → Follow-up w/ Supplier → Below Reorder → OK   ·   on AVAILABLE stock   ·   display adds: Inactive · Not Planned · No Lead Time</text>
  </g>
</svg>
</div>
</body>
</html>
